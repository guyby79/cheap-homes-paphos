<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#0b5fff"><title>Map — homes under €250,000 around Polis, Peyia &amp; Coral Bay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
html,body{height:100%;margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1c2430}
#bar{position:absolute;z-index:1000;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(255,255,255,.95);border:1px solid #e3e7ec;border-radius:10px;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#bar select,#bar input{font:inherit;padding:5px 7px;border:1px solid #e3e7ec;border-radius:7px}
#map{height:100%}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:10px;color:#5b6675;font-size:12.5px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}.dot.exact{background:#0b5fff}.dot.approx{background:#fff;border:2px dashed #b7791f}
</style>
</head>
<body>
<div id="bar">
  <a href="index.html">← List view</a>
  <select id="village"><option value="">All villages</option></select>
  <select id="type"><option value="">Houses + apartments</option><option value="house">Houses</option><option value="apartment">Apartments</option></select>
  <label>Max <input type="range" id="max" min="30000" max="250000" step="5000" value="250000"> <span id="maxlbl">€250,000</span></label>
  <select id="beds"><option value="">Any beds</option><option value="0">Studio+</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option></select>
  <span id="count"></span>
  <span class="legend"><span><i class="dot exact"></i> exact</span><span><i class="dot approx"></i> approximate</span></span>
</div>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const fmt = n => '€' + n.toLocaleString('en-GB'); const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map = L.map('map').setView([34.93, 32.42], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false}); map.addLayer(cluster);
let DATA, firstFit = true; const st = {village:'', type:'', max:250000, beds:''};
fetch('data.json').then(r => r.json()).then(d => { DATA = d; const vs = document.getElementById('village'); Object.keys(d.meta.villages).sort().forEach(v => vs.insertAdjacentHTML('beforeend', `<option value="${esc(v)}">${esc(v)} (${d.meta.villages[v]})</option>`)); render(); });
document.getElementById('village').onchange = e => { st.village = e.target.value; render(); };
document.getElementById('type').onchange = e => { st.type = e.target.value; render(); };
document.getElementById('beds').onchange = e => { st.beds = e.target.value; render(); };
document.getElementById('max').oninput = e => { st.max = +e.target.value; document.getElementById('maxlbl').textContent = fmt(st.max); render(); };
function render(){
  cluster.clearLayers(); let n = 0;
  DATA.listings.filter(r => (!st.village || r.village === st.village) && (!st.type || r.type === st.type) && r.price <= st.max && (st.beds === '' || (r.beds != null && r.beds >= +st.beds))).forEach(r => {
    n++;
    const thumb = r.photos && r.photos[0] ? `<img src="img/${esc(r.photos[0].file)}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px" alt="">` : '';
    const popup = `<div style="width:230px">${thumb}<div style="font-weight:700;font-size:16px;margin-top:6px">${fmt(r.price)}</div><div>${esc(r.title)}</div><div style="color:#666">${esc(r.village)} · ${r.type}${r.beds != null ? ' · ' + (r.beds === 0 ? 'studio' : r.beds + ' bed') : ''}${r.baths ? ' · ' + r.baths + ' bath' : ''}${r.area_m2 ? ' · ' + r.area_m2 + ' m²' : ''}${r.pin_exact ? '' : ' · <b>map position from the agency, approximate</b>'}</div>${r.status ? `<div style="color:#b45309;font-weight:600">${esc(r.status)}</div>` : ''}${r.status_hint ? `<div style="color:#b45309" title="${esc(r.status_hint)}">possibly ${esc(r.status_hint.split(' on ')[0])} — ${esc(r.status_hint)}</div>` : ''}<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.source)} ↗</a> · <a href="index.html#c-${esc(r.id)}">card</a></div>`;
    const mk = r.pin_exact ? L.marker([r.lat, r.lon]) : L.circleMarker([r.lat + (Math.random()-.5)*0.004, r.lon + (Math.random()-.5)*0.004], {radius: 7, color: '#b7791f', dashArray: '3 3', weight: 2, fillColor: '#fff', fillOpacity: .9});
    mk.bindPopup(popup); cluster.addLayer(mk);
  });
  document.getElementById('count').textContent = n + ' listings';
  if (firstFit && n) { map.fitBounds(cluster.getBounds().pad(0.08)); firstFit = false; }
}
</script>
</body>
</html>
